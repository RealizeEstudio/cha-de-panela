<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes · Camila & Lucas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <audio id="musica" loop>
        <source src="music/musica.mp3" type="audio/mpeg">
    </audio>
    <script>
        window.addEventListener("load", () => {
            if (localStorage.getItem("musica") === "tocando") {
                document.getElementById("musica").play().catch(() => { });
            }
        });
        document.addEventListener("click", function once() {
            document.getElementById("musica").play().catch(() => { });
            document.removeEventListener("click", once);
        });
    </script>

    <div class="bg-ornament top-left"></div>
    <div class="bg-ornament bottom-right"></div>

    <main class="list-page">

        <header class="list-header fade-in">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 20 20" fill="none" width="16">
                    <path d="M13 4L7 10l6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Voltar
            </a>
            <div class="monogram small">C <span class="amp">&amp;</span> L</div>
        </header>

        <section class="list-intro fade-in delay-1">
            <p class="supertitle">Escolha com carinho</p>
            <h1 class="title-main smaller">Lista de Presentes</h1>
            <div class="palette-strip">
                <span class="swatch s1"></span>
                <span class="swatch s2"></span>
                <span class="swatch s3"></span>
                <span class="swatch s4"></span>
                <span class="palette-label">Paleta: branco · areia · bege · palha</span>
            </div>
        </section>

        <div class="aviso-box fade-in delay-2">
            <svg viewBox="0 0 20 20" fill="none" width="16" style="flex-shrink:0;margin-top:2px">
                <circle cx="10" cy="10" r="8.5" stroke="#b89a6f" stroke-width="1.2" />
                <path d="M10 9v5M10 7v.5" stroke="#b89a6f" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>Após inserir seu nome no(s) presente(s) desejado(s), clique em <strong>"Confirmar presentes"</strong>
                no final da página.</span>
        </div>

        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>Carregando a lista...</p>
        </div>

        <div id="lista-presentes" class="gift-grid"></div>

        <div class="confirm-area fade-in">
            <button class="btn-primary" onclick="confirmarPresentes()">
                <span>Confirmar presentes</span>
                <svg class="btn-arrow" viewBox="0 0 20 20" fill="none">
                    <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>

    </main>

    <div id="toast" class="toast" style="display:none">
        Por favor, insira seu nome em pelo menos um presente!
    </div>

    <script type="module" src="script/script.js"></script>
    <script type="module" src="script/config.js"></script>
    
</body>

</html>
