<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes · Camila & Lucas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <audio id="musica" loop>
        <source src="music/musica.mp3" type="audio/mpeg">
    </audio>
    <script>
        window.addEventListener("load", function () {
            if (localStorage.getItem("musica") === "tocando")
                document.getElementById("musica").play().catch(function () { });
        });
        document.addEventListener("click", function once() {
            document.getElementById("musica").play().catch(function () { });
            document.removeEventListener("click", once);
        });
    </script>

    <div class="bg-ornament top-left"></div>
    <div class="bg-ornament bottom-right"></div>

    <main class="list-page">
        <header class="list-header fade-in">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 20 20" fill="none" width="16">
                    <path d="M13 4L7 10l6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Voltar
            </a>
            <div class="monogram small">C <span class="amp">&amp;</span> L</div>
        </header>

        <section class="list-intro fade-in delay-1">
            <p class="supertitle">Escolha com carinho</p>
            <h1 class="title-main smaller">Lista de Presentes</h1>
            <div class="palette-strip">
                <span class="swatch s1"></span>
                <span class="swatch s2"></span>
                <span class="swatch s3"></span>
                <span class="swatch s4"></span>
                <span class="palette-label">Paleta: branco · areia · bege · palha</span>
            </div>
        </section>

        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>Carregando a lista...</p>
        </div>

        <div id="progress-wrap"></div>
        <div id="lista-presentes" class="gift-grid"></div>
    </main>

    <div id="modal-overlay" class="modal-overlay" onclick="fecharModal()" style="display:none"></div>
    <div id="confirm-modal" class="confirm-modal" style="display:none">
        <button class="modal-close" onclick="fecharModal()">
            <svg viewBox="0 0 20 20" fill="none" width="16">
                <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
        </button>
        <p class="modal-label">Você escolheu:</p>
        <p class="modal-gift-name" id="modal-gift-label"></p>
        <p class="modal-ask">Qual é o seu nome?</p>
        <input id="modal-nome" type="text" placeholder="Seu nome completo" autocomplete="name">
        <button class="btn-primary modal-confirm-btn" id="modal-btn-confirm" onclick="confirmarEscolha()">
            <span>Confirmar presente</span>
            <svg class="btn-arrow" viewBox="0 0 20 20" fill="none">
                <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <div id="toast" class="toast" style="display:none"></div>

    <script src="script/script.js"></script>
</body>

</html>
